<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#0F4C81'}}}}</script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
<div class="bg-white p-8 rounded-xl shadow w-full max-w-md">
  <h2 class="text-2xl font-bold text-center mb-6">Admin Login</h2>
  <form id="loginForm">
    <div class="mb-4">
      <label class="block mb-1">Username</label>
      <input type="text" name="username" class="border w-full px-3 py-2 rounded" required>
    </div>
    <div class="mb-4">
      <label class="block mb-1">Password</label>
      <input type="password" name="password" class="border w-full px-3 py-2 rounded" required>
    </div>
    <button type="submit" class="w-full bg-primary text-white py-2 rounded hover:bg-sky-800">Login</button>
    <div id="tip" class="mt-3 text-center text-red-500"></div>
  </form>
</div>
<script>
const form = document.getElementById('loginForm');
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const fd = new FormData(form);
  const data = Object.fromEntries(fd.entries());
  const r = await fetch('/api/login',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(data)
  });
  const ret = await r.json();
  if(ret.ok){
    location.href="/admin/dashboard.html";
  }else{
    document.getElementById('tip').innerText = ret.msg;
  }
})
</script>
</body>
</html>
