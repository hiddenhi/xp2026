<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Inquiry</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
tailwind.config = {theme:{extend:{colors:{primary:'#0F4C81'}}}}
const params = new URLSearchParams(location.search);
const cat = params.get('cat') || 'General';
const prod = params.get('prod') || 'General Inquiry';
document.title = prod + " | ABC Trading";
</script>
</head>
<body>
<nav class="bg-primary text-white sticky top-0 z-50">
<div class="container mx-auto px-4 py-4 flex justify-between items-center">
  <a href="/" class="text-xl font-bold">ABC TRADING</a>
  <div class="hidden md:flex gap-6">
    <a href="/">Home</a><a href="/products.html">Products</a><a href="/about.html">About</a><a href="/contact.html">Contact</a>
  </div>
</div>
</nav>
<section class="py-12">
<div class="container mx-auto px-4 grid md:grid-cols-2 gap-10">
  <div>
    <span class="bg-sky-100 text-primary px-3 py-1 rounded text-sm">Category: <script>document.write(cat)</script></span>
    <h1 class="text-3xl font-bold mt-3"><script>document.write(prod)</script></h1>
    <p class="mt-4 text-gray-600">OEM & ODM available, factory direct price. Send inquiry for latest quotation.</p>
  </div>
  <div class="border rounded-xl p-6 shadow-sm">
    <h3 class="text-xl font-semibold mb-4">Send Inquiry</h3>
    <form id="inquiryForm">
      <input type="hidden" name="category" value="">
      <input type="hidden" name="product" value="">
      <div class="grid gap-4">
        <input class="border w-full px-3 py-2 rounded" name="name" placeholder="Your Name *" required>
        <input class="border w-full px-3 py-2 rounded" name="email" placeholder="Email *" required type="email">
        <input class="border w-full px-3 py-2 rounded" name="whatsapp" placeholder="WhatsApp / Phone">
        <input class="border w-full px-3 py-2 rounded" name="country" placeholder="Country">
        <input class="border w-full px-3 py-2 rounded" name="quantity" placeholder="Quantity">
        <textarea class="border w-full px-3 py-2 rounded h-28" name="message" placeholder="Your requirement, specification..."></textarea>
        <button type="submit" class="bg-primary text-white py-3 rounded hover:bg-sky-800">Submit Inquiry</button>
        <div id="msg" class="text-center"></div>
      </div>
    </form>
  </div>
</div>
</section>
<script>
document.querySelector('[name="category"]').value = cat;
document.querySelector('[name="product"]').value = prod;
const form = document.getElementById('inquiryForm');
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const fd = new FormData(form);
  const data = Object.fromEntries(fd.entries());
  const res = await fetch('/api/submit-inquiry',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(data)
  });
  const ret = await res.json();
  const msgBox = document.getElementById('msg');
  if(ret.ok){
    msgBox.innerHTML = '<span class="text-green-600">Thank you! We will reply soon.</span>';
    form.reset();
  }else{
    msgBox.innerHTML = '<span class="text-red-500">Submit failed, try later.</span>';
  }
})
</script>
</body>
</html>
